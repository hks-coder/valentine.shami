<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine</title>
</head>
<body>
    <h1>Will you be my Valentine?</h1>
    <button id="yes">YES</button>
    <button id="no">NO</button>
    <img id="photo" src="images/photo.jpg" alt="valentine photo">
    <a id="downloadBtn" href="#">Download</a>
    <script>
        document.getElementById('yes').onclick = function() {
            document.getElementById('photo').src = 'https://drive.google.com/uc?export=view&id=1hJuYpaqwCrKDvbEgTcdg5ZfHjj929NrF';
            document.getElementById('downloadBtn').href = 'https://drive.google.com/uc?export=view&id=1hJuYpaqwCrKDvbEgTcdg5ZfHjj929NrF';
        };
    </script>
</body>
</html>
